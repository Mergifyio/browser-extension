name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - devs/**

# Every job only reads the repository, whatever the repository's default
# token permissions are.
permissions:
  contents: read

concurrency:
  # yamllint disable-line rule:line-length
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # actionlint's own image, which also pins the shellcheck it runs on
      # run: scripts. Keep both the tag and the digest: Renovate bumps the
      # tag and the digest together, and it cannot bump a digest alone to a
      # new version.
      - name: Check workflow files
        # yamllint disable-line rule:line-length
        uses: docker://rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -color

  test:
    timeout-minutes: 20
    runs-on: macos-26
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc

      # Install like the release job does, so a dependency that starts
      # needing its install script fails here rather than at release.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          brew install gnu-sed
      
      - name: Test
        run: |

          npm run lint
          npm run test

          sudo xcode-select -s /Applications/Xcode.app
          make

  # TEMPORARY, do not merge: compares the Safari build on both images.
  safari-build-check:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          brew install gnu-sed

      - name: Build the package as the test job does, and inspect it
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          make mergify-safari-dev.pkg 2>&1 | tee build.log
          echo "::group::deployment target warnings"
          grep -i 'deployment target' build.log | sort -u || echo "none"
          echo "::endgroup::"
          pkgutil --expand-full mergify-safari-dev.pkg expanded
          app=expanded/com.mergify.mergify-safari.pkg/Payload/mergify-safari.app
          appex="$app/Contents/PlugIns/mergify-safari Extension.appex"
          for bundle in "$app" "$appex"; do
            echo "== ${bundle#expanded/}"
            for key in LSMinimumSystemVersion DTXcode DTSDKName; do
              echo "$key: $(/usr/libexec/PlistBuddy -c "Print :$key" "$bundle/Contents/Info.plist")"
            done
            binary="$bundle/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")"
            echo "archs: $(lipo -archs "$binary")"
            xcrun vtool -show-build "$binary"
          done

      # The release build archives for arm64 and x86_64 with Developer ID
      # signing; this repeats it with signing off, the part CI can run.
      - name: Archive for arm64 and x86_64, unsigned
        run: |
          set -euo pipefail
          make mergify-safariTMP-dev.zip
          mkdir -p universal/src
          (cd universal/src && unzip -q ../../mergify-safariTMP-dev.zip)
          xcrun safari-web-extension-converter --no-prompt --force \
            --copy-resources --macos-only --no-open \
            --app-name mergify-safari \
            --bundle-identifier com.mergify.mergify-safari \
            --project-location universal universal/src
          echo "== deployment target in the generated project"
          grep -h 'MACOSX_DEPLOYMENT_TARGET' \
            universal/mergify-safari/mergify-safari.xcodeproj/project.pbxproj | sort -u
          xcodebuild -project universal/mergify-safari/mergify-safari.xcodeproj \
            -scheme mergify-safari -configuration Release -sdk macosx \
            -archivePath universal/build.xcarchive \
            -derivedDataPath universal/build archive \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=10.14 \
            2>&1 | tee universal.log | tail -5
          grep -i 'deployment target' universal.log | sort -u || echo "no deployment target warnings"
          binary=universal/build.xcarchive/Products/Applications/mergify-safari.app/Contents/MacOS/mergify-safari
          echo "archs: $(lipo -archs "$binary")"
          xcrun vtool -show-build "$binary"

  # release.yaml runs these CLIs only on a release, with the store
  # credentials. Install and start each one the same way here, so a
  # bump that breaks one fails its pull request, not the next release.
  release-tools:
    name: release tools (${{ matrix.dir }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - dir: chrome
            bin: chrome-webstore-upload
          - dir: firefox
            bin: web-ext
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install from the lockfile
        working-directory: release-tools/${{ matrix.dir }}
        run: npm ci --ignore-scripts

      - name: Start the CLI
        working-directory: release-tools/${{ matrix.dir }}
        env:
          BIN: ${{ matrix.bin }}
        run: node_modules/.bin/"$BIN" --version

  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - actionlint
      - test
      - release-tools
    runs-on: ubuntu-26.04
    steps:
      - name: Verify all jobs succeeded
        uses: Mergifyio/gha-mergify-ci@2c07ded2622520933bc1f16ba49c9a626d6d90ac  # v30
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
