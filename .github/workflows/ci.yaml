name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - devs/**

# Every job only reads the repository, whatever the repository's default
# token permissions are.
permissions:
  contents: read

concurrency:
  # yamllint disable-line rule:line-length
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The release archive at a fixed version, checked against the SHA-256
      # published in that release's checksums file, instead of an installer
      # script fetched from actionlint's main branch. Bump both together.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          rm "$archive"

      - name: Check workflow files
        run: ./actionlint -color

  test:
    timeout-minutes: 20
    runs-on: macos-15
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '23'
        
      - name: Install dependencies
        run: |
          npm ci
          brew install gnu-sed
      
      - name: Test
        run: |

          npm run lint
          npm run test

          sudo xcode-select -s /Applications/Xcode.app
          make

  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - actionlint
      - test
    runs-on: ubuntu-26.04
    steps:
      - name: Verify all jobs succeeded
        uses: Mergifyio/gha-mergify-ci@29114c5c7ab4abec65e88509c3d05e94e05fbe52  # v28
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
