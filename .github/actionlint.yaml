# actionlint (run by ci.yaml) validates `runs-on` against its own list of
# GitHub-hosted labels, and the release ci.yaml pins knows neither of
# these. The key is named `self-hosted-runner`, but it is just the list of
# extra labels actionlint should accept: drop an entry once the pinned
# actionlint knows its label (1.7.12 knows `macos-26`, not `ubuntu-26.04`).
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - macos-26
